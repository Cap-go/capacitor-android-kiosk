name: Deploy example app to Capgo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    name: Deploy example app to Capgo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Compute unique bundle version
        id: bundle_version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          version="${version%%+*}"
          if [[ "$version" == *"-"* ]]; then
            bundle="${version}.example.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          else
            bundle="${version}-example.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Using bundle version: $bundle"

      - name: Build example app
        run: bun run example:build

      - name: Capgo upload disabled notice
        if: ${{ vars.CAPGO_EXAMPLE_UPLOAD_ENABLED != 'true' }}
        run: |
          echo "Skipping Capgo bundle upload because vars.CAPGO_EXAMPLE_UPLOAD_ENABLED is not set to true."
          echo "Create the Capgo app and set the repository variable when you are ready to publish."

      - name: Deploy to Capgo
        if: ${{ vars.CAPGO_EXAMPLE_UPLOAD_ENABLED == 'true' }}
        working-directory: example-app
        run: |
          bunx @capgo/cli@latest bundle upload app.capgo.android.kiosk \
            --bundle "${{ steps.bundle_version.outputs.bundle }}" \
            --path dist \
            --channel production \
            --package-json package.json,../package.json \
            --node-modules node_modules,../node_modules \
            --delta \
            --no-key \
            --ignore-checksum-check \
            --apikey "$CAPGO_TOKEN"
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
