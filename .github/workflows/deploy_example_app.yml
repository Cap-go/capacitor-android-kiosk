name: Deploy example app to Capgo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    name: Deploy example app to Capgo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          no-cache: true

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Compute unique bundle version
        id: bundle_version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          version="${version%%+*}"
          if [[ "$version" == *"-"* ]]; then
            bundle="${version}.example.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          else
            bundle="${version}-example.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Using bundle version: $bundle"

      - name: Build example app
        run: bun run example:build

      - name: Deploy to Capgo
        working-directory: example-app
        run: |
          bunx @capgo/cli@latest bundle upload app.capgo.android.kiosk \
            --bundle "$BUNDLE_VERSION" \
            --path dist \
            --channel production \
            --package-json package.json,../package.json \
            --node-modules node_modules,../node_modules \
            --delta \
            --no-key \
            --ignore-checksum-check \
            --apikey "$CAPGO_TOKEN"
        env:
          BUNDLE_VERSION: ${{ steps.bundle_version.outputs.bundle }}
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
